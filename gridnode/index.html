<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GridNode — Book a charger near you</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e3b43'/%3E%3Cpath d='M18 4L8 18h7l-1 10 10-14h-7z' fill='%23f2b01e'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#find"><span class="logo">⚡</span>GridNode</a>
  <nav id="nav" aria-label="Main">
    <button data-view="find">Find a charger</button>
    <button data-view="bookings">My bookings <span id="bk-count" class="pill"></span></button>
    <button data-view="host">Host console</button>
  </nav>
  <div class="who">
    <select id="loc" aria-label="Location"></select>
    <div class="seg" role="group" aria-label="Role">
      <button data-role="driver">Driver</button><button data-role="host">Host</button>
    </div>
  </div>
</header>
<main id="main"></main>
<dialog id="book"></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<footer>
  <span>GridNode · peer-to-peer and highway EV charging</span>
  <button data-view="privacy">Privacy</button><button data-view="terms">Terms</button>
  <button id="reset">Reset demo data</button>
</footer>
<script src="js/seed.js"></script>
<script src="js/db.js"></script>
<script src="js/app.js"></script>
</body>
</html>
